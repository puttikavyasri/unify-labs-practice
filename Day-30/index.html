<!DOCTYPE html>
<html>
<head>
    <title>Simple Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>My Online Store</h1>
    <input type="text" id="search" placeholder="Search products..." onkeyup="filterProducts()">
</header>

<select id="categoryFilter" onchange="loadProducts()">
    <option value="">All Categories</option>
    <option value="Electronics">Electronics</option>
    <option value="Clothing">Clothing</option>
</select>

<section id="products" class="grid"></section>

<h2>Shopping Cart</h2>
<ul id="cartList"></ul>
<p id="total"></p>

<h2>Checkout</h2>
<input type="text" id="custName" placeholder="Name">
<input type="email" id="custEmail" placeholder="Email">
<input type="text" id="custAddress" placeholder="Address">
<button onclick="checkout()">Place Order</button>

<script src="script.js"></script>
</body>
</html>
